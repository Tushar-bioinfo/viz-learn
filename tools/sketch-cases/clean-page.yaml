# expect: clean
title: Two markers split six cells
question: Can two markers tell T cells from B cells?
answer: Yes, CD3 and CD19 pull the cells into two clumps.
goal: See how two markers separate six cells.
seed: clean
data:
  ids: [c1, c2, c3, c4, c5, c6]
  cd3: [4.3, 0.5, 4.9, 0.6, 0.2, 1.3]
  cd19: [0.7, 3.5, 0.7, 0.6, 4.3, 0.7]
abbr:
  CD3: a surface marker on T cells
  CD19: a surface marker on B cells
symbols:
  mx: {tex: '\bar{x}', says: mean CD3}
derive:
  mx: mean(cd3)
sheets:
  - beat: plan
    title: What we will do
    ratio: "16:4"
    note:
      shown: Three steps, in the order we take them.
      read: Follow the gold thread down the page.
      why: A plan shows where each step fits the goal.
    figure:
      - {text: "Table, then picture, then the rule.", at: [2, 3], width: 80, size: 3, letter: true}
  - beat: data
    title: Six cells, two markers
    ratio: "16:7"
    stop: {say: "The table we start from", shape: "{{len(ids)}} cells × 2 markers"}
    note:
      shown: Six cells measured for two surface markers.
      read: Each row is one cell, and each column one marker.
      why: The goal needs real numbers before any picture.
      changed: We moved from the plan to the numbers.
    figure:
      - id: cells
        at: [2, 2]
        width: 38
        table: {rows: ids, head: cell, cols: [{key: cd3, label: CD3, fmt: 1}, {key: cd19, label: CD19, fmt: 1}], mark: {row: 2}}
    label:
      - {on: cells.row.2, say: the brightest T cell, dx: 3, dy: 0}
  - beat: by-hand
    title: Average the first marker
    ratio: "16:4"
    stop: {say: "We add and divide", shape: "one number per marker"}
    note:
      shown: The six CD3 values added and divided by six.
      read: Left of the equals sign is the name, right is the sum.
      why: The average tells us where the middle of the cells sits.
      changed: Six numbers became one.
    more:
      - {ask: "Why divide by six?", answer: "Because there are {{len(cd3)}} cells, so each one gets an equal say."}
    think: {q: "Which cell sits furthest above the average?", a: "Cell c3, at {{max(cd3)|1}}."}
    figure:
      - {calc: {expr: mean(cd3), name: mx, say: Add and divide, fmt: 2}, at: [2, 3], width: 70}
  - beat: limits
    title: Two markers are not always enough
    ratio: "16:4"
    stop: {say: "The clumps can overlap", shape: "same cells, more noise"}
    note:
      shown: Where two markers stop being enough.
      read: The red branch leaves at this stop.
      why: Knowing the limit keeps the goal honest.
      changed: We looked for where the split fails.
    break: {rule: "Two clumps need two groups that really differ.", path: "Pick two markers that both groups share."}
    figure:
      - {text: "Marker choice decides what can split.", at: [2, 3], width: 80, size: 3, letter: true}
  - beat: picture
    title: The same cells as dots
    ratio: "16:8"
    note:
      shown: One dot per cell, placed by its two markers.
      read: Further right means more CD3; higher means more CD19.
      why: A picture shows the two clumps at a glance.
      changed: The table became a picture.
    figure:
      - id: plot
        at: [14, 1]
        width: 64
        height: 42
        plot:
          x: {label: CD3, min: 0, max: 5}
          y: {label: CD19, min: 0, max: 5}
          layers:
            - {dots: [cd3, cd19], names: ids, color: accent, id: cells}
    label:
      - {on: plot.cells.c3, say: cell c3}
  - beat: summary
    title: Two markers, two clumps
    ratio: "16:4"
    note:
      shown: The answer to the opening question.
      read: Read it as one sentence.
      why: The goal was to see the split, and now we have.
      changed: We stopped adding and started summing up.
    figure:
      - {text: "CD3 and CD19 pull the six cells apart.", at: [2, 3], width: 80, size: 3, letter: true}
  - beat: what-if
    title: Move one cell
    ratio: "16:4"
    note:
      shown: One cell's CD3 changing.
      read: Slide it and watch the average move.
      why: One cell can pull the middle, which matters for the goal.
      changed: Now you drive the numbers.
    controls:
      - {name: bump, min: 0, max: 5, step: 0.5, value: 0, label: Add to c3}
    derive:
      shifted: mean(cd3) + bump / len(cd3)
    figure:
      - {text: "The average is now {{shifted|2}}.", at: [2, 3], width: 80, size: 3, letter: true}
  - beat: next
    title: What about many markers?
    ratio: "16:4"
    note:
      shown: The question for next time.
      read: Keep it in mind for the next page.
      why: Real panels have dozens of markers, not two.
      changed: We turned from two markers to many.
    figure:
      - {text: "Twenty markers do not fit on one picture.", at: [2, 3], width: 80, size: 3, letter: true}
  - beat: review
    title: Say it before you turn it over
    cards:
      - {q: "What does one row of the table hold?", a: One cell.}
      - {q: "What does one dot stand for?", a: One cell.}
      - {q: "What does the average tell us?", a: Where the middle of the cells sits.}
      - {q: "Which marker is high in T cells?", a: CD3.}
      - {q: "When do two markers fail?", a: When both groups share them.}
