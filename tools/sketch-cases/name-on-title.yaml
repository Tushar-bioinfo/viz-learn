# expect: text overlaps
# base: clean-page
sheets:
  - beat: data
    title: A table name on the title line
    ratio: "16:7.2"
    stop: {say: "The table again", shape: "two markers"}
    note:
      shown: One row of six numbers.
      read: Left to right, one number per cell.
      why: The goal needs these numbers.
      changed: We wrote them down.
    figure:
      - id: named
        at: [2, 0.5]
        width: 38
        table: {rows: ids, head: cell, name: "This name rises into the title", cols: [{key: cd3, label: CD3, fmt: 1}]}
