# expect: sheets are 16:9
# base: clean-page
sheets:
  - beat: by-hand
    title: Average a
    ratio: "16:9"
    stop: {say: "We add and divide", shape: "one number per marker"}
    note:
      shown: The six values added and divided by six, step a.
      read: Left of the equals sign is the name, right is the sum.
      why: The average tells us where the middle of the cells sits.
      changed: Another number joined the row, step a.
    figure:
      - {calc: {expr: mean(cd3), name: ma, say: Add and divide, fmt: 2}, at: [2, 3], width: 70}
