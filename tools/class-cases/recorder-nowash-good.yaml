  - type: board
    beat: data
    idea: process
    see: height
    shows: the water height read every hour, as a pen trace on a recorder strip
    title: Thirty hours at the gauge
    lead: Each dot is one reading of the water height.
    steps:
      - say: The ==height== trace rises and falls twice a day.
        add:
          - recorder: {from: tide, x: {key: hour, label: hours}, y: {key: metres, label: height}, name: height, key: "Higher trace, deeper water.", wash: false}
      - say: The pen rests on the last reading.
