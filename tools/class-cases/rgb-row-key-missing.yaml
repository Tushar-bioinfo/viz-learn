# expect: plane mark 1: row 2 (p2) has no number for rgb r: missing: give every row that key
# expect: not: row 1 (p1) has no number
# A points mark's rgb channel is a key of each row; a lesson-wide value of that name is never borrowed.
title: A missing row key
question: Does a channel that is not a row key get reported, not borrowed?
answer: Yes.
data:
  missing: 7
  pixels: [{id: p1, red: 10, green: 0, missing: 3}, {id: p2, red: 0, green: 10}]
symbols: {}
slides:
  - type: title
  - type: board
    beat: picture
    title: Pixels as dots
    steps:
      - say: 'Two pixels; p2 has no value for the red channel.'
        add:
          plane:
            x: {label: red level, min: 0, max: 12}
            y: {label: green level, min: 0, max: 12}
            marks:
              - points: {from: pixels, x: red, y: green, label: id}
                rgb: {r: missing, g: green, max: 10}
      - say: The check reads every colour word.
  - type: recap
    answer: A colour word must fit the colour drawn.
