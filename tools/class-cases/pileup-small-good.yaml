    lead: Each dot is one bird seen at a feeder.
    steps:
      - say: Both feeders stand in the ==garden==.
        add:
          - pileup: {from: feeders, name: name, group: place, runs: {morning: [am], evening: [pm]}, unit: birds, colors: [s2]}
      - say: Feeder B fills up in the evening.
        mark: cell:1:pm
