# expect: builds
# expect: pop-up cards measured
# expect: not: pop-up card "
# expect: not: has no field `term`
# N9b: `term:` on a symbol, a plane mark and a control gives the card's foot ("field term: …"); check.py opens every card
# and measures its text against the lightest pixel behind it (4.5 : 1).
title: A card with its field's term
question: What does a card's foot say?
answer: The field's own name.
data: {base: [1, 2]}
symbols:
  y: {tex: y, says: twice the slider, short: double, term: linear scaling}
  k: {tex: k, says: the slider's value, short: slider}
slides:
  - type: title
  - type: board
    beat: picture
    title: Move the slider
    controls: [{name: t, min: 1, max: 3, step: 1, value: 2, label: scale, says: how far the point moves, term: scale factor}]
    derive: {k: t, y: 2 * k}
    steps:
      - say: 'The slider is {{k}}, so y is {{y}}.'
        add: {calc: {say: Twice the slider, expr: 2 * k, name: y}}
      - say: The ==tip== sits at the scaled point.
        add:
          plane:
            x: {label: across, min: 0, max: 8}
            y: {label: up, min: 0, max: 8}
            marks:
              - {point: [k, y], label: tip, says: where the scaled point lands, term: image point, color: s2}
  - type: recap
    answer: The card names its field term.
