# expect: not: legend name
# expect: not: legend entries
# change 6 review: series names that equal the x cats draw no legend on a board, so they are neither checked nor counted: 4 marks = 4 entries.
title: Six cells and their mean
question: Where do six cells sit around their mean?
answer: Around the mean, some far.
data: {cd3: [4.3, 4.9, 4.6, 4.0, 4.5, 4.4], lo: 4.2, hi: 4.7}
symbols:
  xbar: {tex: '\bar{x}', says: the mean CD3 level of the six cells, short: mean, fmt: 2}
  top: {tex: 'x_{\max}', says: the highest CD3 level of the six, short: top cell, fmt: 1}
  k: {tex: k, says: how far the second cell is moved, short: shift, fmt: 1}
slides:
  - type: title
  - type: board
    beat: what-if
    title: Move one cell, watch the mean
    lead: One cell moves; the mean follows.
    controls:
      - {name: k, min: 0, max: 2, step: 0.5, value: 0}
    derive:
      cw: cd3 + (seq(0, 5, 1) == 1) * k
      xbar: mean(cw)
      top: max(cw)
    steps:
      - say: Six cells, and their mean as a dashed line.
        add:
          chart:
            x: {cats: [the cells before, the cells after], label: when}
            y: {label: CD3 level, min: 3, max: 7.5}
            series:
              - {name: the cells before, kind: bars, x: '[0]', y: '[mean(cd3)]', color: mist}
              - {name: the cells after, kind: bars, x: '[1]', y: '[mean(cw)]', color: s1}
            marks:
              - {kind: hline, y: 4, color: s2, name: line a, says: a reference line, number a}
              - {kind: hline, y: 5, color: s3, name: line b, says: a reference line, number b}
              - {kind: hline, y: 6, color: good, name: line c, says: a reference line, number c}
              - {kind: hline, y: 7, color: bad, name: line d, says: a reference line, number d}
          caption: The dashed line is the mean.
      - say: Drag the shift and the mean climbs a little.
  - type: recap
    answer: Around the mean, some far.
