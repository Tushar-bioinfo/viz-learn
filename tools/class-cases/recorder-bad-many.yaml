slides:
  - type: title
  - type: board
    beat: data
    idea: process
    see: density
    shows: the flask's cloudiness read every 30 minutes, as a pen trace on a recorder strip
    title: Eight hours of readings
    lead: Each dot is one reading of the broth's cloudiness.
    steps:
      - say: The ==density== trace stays flat, then climbs, then levels off.
        add:
          - recorder: {from: growth, x: {key: min, label: minutes}, y: {key: od, label: density, fmt: 2}, name: density, key: "Higher trace, cloudier broth."}
      - say: The pen rests on the last reading.
