# expect: builds
# The quarters a product's sign splits the plot into, round a crossing a slider moves.
title: Signs of a product
question: Where is a product of two numbers positive?
answer: Where both have the same sign, the washed quarters.
data: {cells: [{id: a, x: 2, y: 1.5}, {id: b, x: -1.5, y: 2}, {id: c, x: -2, y: -1}, {id: d, x: 1, y: -2}]}
symbols: {}
slides:
  - type: title
  - type: board
    beat: plan
    title: The plan
    steps:
      - add: {flow: {nodes: [the signs, the product], verbs: [give]}}
  - type: board
    beat: picture
    title: Four quarters
    lead: The sign of x times y.
    controls:
      - {name: cx, label: crossing, says: where the upright zero line crosses, min: -1, max: 1, step: 0.5, value: 0}
    steps:
      - say: The washed quarters give a positive product.
        add:
          plane:
            x: {label: x, min: -3, max: 3}
            y: {label: y, min: -3, max: 3}
            marks:
              - points: {from: cells, x: x, y: y, label: id}
              - {line: ['-cx', 1, 0], color: mist}
              - {line: [0, 0, 1], color: mist}
              - {quarters: [cx, 0]}
      - say: Move the crossing and the wash follows it.
  - type: recap
    answer: Same signs give a positive product.
