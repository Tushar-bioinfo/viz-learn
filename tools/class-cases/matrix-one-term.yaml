# expect: builds
# expect: not: more than 5 is a wall
# A 2x2 bmatrix holding four tagged terms, times a vector, plus two more terms: the matrix reads as one term, so 3 in all.
title: A matrix is one term
question: Does a matrix count as one term?
answer: Yes, however many entries it holds.
data: {a: 2, b: 1, c: 0, d: 3, v: 4, u: 5, y: 7}
symbols:
  a: {tex: 'a', says: the top-left entry}
  b: {tex: 'b', says: the top-right entry}
  c: {tex: 'c', says: the bottom-left entry}
  d: {tex: 'd', says: the bottom-right entry}
  v: {tex: 'v', says: the input vector}
  u: {tex: 'u', says: the shift}
  y: {tex: 'y', says: the output}
slides:
  - type: title
  - type: board
    beat: picture
    title: A matrix times a vector
    steps:
      - say: 'The entries are {{a}}, {{b}}, {{c}} and {{d}}.'
      - say: 'The input is {{v}}, the shift {{u}}, the output {{y}}.'
      - say: The matrix turns the vector, then the shift moves it.
        add: {eqn: {say: The output, lhs: y, tex: '\begin{bmatrix} [a] & [b] \\ [c] & [d] \end{bmatrix} [v] + [u]'}}
      - say: The four entries act together, as one object.
  - type: recap
    answer: A matrix reads as one term.
