# expect: holds 5 records; a wheel draws 6 to 59
# N5: wheel-good with one fault (5 records).
title: What colour is a stained pixel?
question: Why does a nucleus look purple?
answer: It holds back much red and green light and little blue, so blue light gets through.
data:
  pixels:
    - {id: 0, group: nucleus, rgb: [51, 26, 127], od_r: 0.699, od_g: 0.986, od_b: 0.302}
    - {id: 1, group: nucleus, rgb: [44, 22, 114], od_r: 0.762, od_g: 1.055, od_b: 0.349}
    - {id: 2, group: nucleus, rgb: [43, 18, 110], od_r: 0.771, od_g: 1.156, od_b: 0.365}
    - {id: 3, group: nucleus, rgb: [61, 29, 130], od_r: 0.620, od_g: 0.946, od_b: 0.293}
    - {id: 4, group: nucleus, rgb: [61, 30, 136], od_r: 0.620, od_g: 0.929, od_b: 0.274}
slides:
  - type: title
  - type: board
    beat: data
    idea: made-of
    see: red
    shows: each pixel as a chip in its true colour, with a spoke for each light it held back
    title: Each pixel and the light it held back
    lead: Each chip is one pixel in its true colour.
    steps:
      - say: The ==red== spokes are long round the nuclei.
        add:
          - wheel: {from: pixels, rgb: rgb, group: group, cols: [{key: od_r, label: red}, {key: od_g, label: green}, {key: od_b, label: blue}], key: "Longer spoke, more held.", fmt: 2}
      - say: This pixel is a nucleus.
        mark: row:2
