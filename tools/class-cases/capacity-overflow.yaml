# expect: split
# A board with more worked lines than one scene holds: the audit must tell the author to split the scene.
title: Too much on one board
question: Does an overfull board warn?
answer: Yes, it asks for a split.
data: {rows: [{cell: c1, cd3: 4}, {cell: c2, cd3: 6}, {cell: c3, cd3: 5}, {cell: c4, cd3: 9}], cd3: [4, 6, 5, 9]}
abbr: {CD3: a T-cell surface marker}
symbols:
  xbar: {tex: '\bar{x}', says: mean CD3}
  cd3: {tex: 'x_i', says: CD3 of cell i}
slides:
  - type: title
  - type: board
    beat: by-hand
    title: Every step on one board
    table: {from: rows, cols: [cell, cd3]}
    steps:
      - say: The mean first.
        add: {calc: {say: Mean, expr: mean(cd3), name: xbar}}
      - say: Each cell's distance, one line at a time.
        add:
          - {calc: {say: c1, row: 0, expr: cd3 - xbar}}
          - {calc: {say: c2, row: 1, expr: cd3 - xbar}}
          - {calc: {say: c3, row: 2, expr: cd3 - xbar}}
          - {calc: {say: c4, row: 3, expr: cd3 - xbar}}
      - say: Now their squares.
        add:
          - {calc: {say: c1 squared, row: 0, expr: (cd3 - xbar)^2}}
          - {calc: {say: c2 squared, row: 1, expr: (cd3 - xbar)^2}}
          - {calc: {say: c3 squared, row: 2, expr: (cd3 - xbar)^2}}
          - {calc: {say: c4 squared, row: 3, expr: (cd3 - xbar)^2}}
          - {col: {key: sq, label: squared, expr: (cd3 - xbar)^2}}
  - type: recap
    answer: Yes, it asks for a split.
