# expect: `term` “the gap that chance alone makes” has 6 words
# expect: `term` “double” only repeats the card's name
# N9b: a card's `term` is the field's own short name, not a sentence and not the `short` again (lesson_lint.lint_names).
title: A long field term
question: What is a term?
answer: A short name.
data: {}
symbols:
  y: {tex: y, says: twice the slider, short: double, term: double}
  k: {tex: k, says: the slider's value, short: slider, term: the gap that chance alone makes}
slides:
  - type: title
  - type: board
    beat: picture
    title: Move the slider
    controls: [{name: k, min: 1, max: 3, step: 1, value: 2}]
    derive: {y: 2 * k}
    steps:
      - say: 'The slider is {{k}}, so y is {{y}}.'
        add: {calc: {say: Twice the slider, expr: 2 * k, name: y}}
  - type: recap
    answer: Short names.
