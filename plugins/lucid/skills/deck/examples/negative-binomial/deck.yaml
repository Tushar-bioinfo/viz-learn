# Example Lucid deck. Probe answers it was built from: "1b 2d 3a 4ac 5b"
# (goal: intuition + by hand · pretest: not sure · knows mean and variance · anchors: cricket, lab work · standard length)
title: Why counts need the negative binomial
subtitle: From one gene's replicates to the noise model inside DESeq2 and MAGeCK
kicker: Counts and noise
question: Why do DESeq2 and MAGeCK model read counts with a negative binomial instead of a Poisson?
answer: Replicates spread far more than counting noise allows, because each sample's true level wobbles. The negative binomial adds that wobble (variance = μ + αμ²), so a test stops calling noise a signal.
arc: puzzle
learner:
  goal: intuition+hand
  knows: [mean, variance]
  anchors: [cricket, lab work]
ladder:
  count: a read count is a tally of molecules
  poisson: counting noise alone (variance = mean)
  overdispersion: variance bigger than the mean
  mixture: each sample has its own true level
  nb: negative binomial (variance = μ + αμ²)
  alpha: dispersion α, the size of the wobble
beats:
  - title · the question
  - predict · what spread should counting alone give? (pretest)
  - idea · a fixed rate still wobbles (chart)
  - equation · SD = √μ, run on our gene
  - idea · but our 6 replicates land outside the counting band (chart)
  - statement · name it, overdispersion
  - idea · so, is it one gene? no, almost every gene sits above the line (chart)
  - bridge · cricket form, a rate that changes from day to day
  - idea · so the noise comes in two stages (flow)
  - predict · same true level, how far apart? (check)
  - idea (slider) · raise α and watch the counts spread (chart)
  - equation · variance = μ + αμ²
  - calc · where α comes from, worked on 6 numbers
  - idea · busy genes are ruled by the wobble (parts)
  - predict · which part rules a gene at 1,000 reads? (check, parts in the reveal)
  - compare · same data, two verdicts
  - calc · against counting noise, z = 2.5
  - calc · but against the real noise, z = 0.9
  - idea · the same gap on one yardstick (chart)
  - recap · the answer
  - map · how it connects
  - quiz · recall

chapters: [Counting noise, Too much spread, Why it matters]
data_file: data.json
data:
  reps: [8, 34, 12, 41, 17, 23]
  muB: 30
  n: 6
derive:
  m: mean(reps)
  v: var(reps)
  s: sd(reps)
  sdp: sqrt(m)
  alpha_hat: (v - m) / m^2
  lo95: m - 2 * sqrt(m)
  hi95: m + 2 * sqrt(m)
  nout: sum((reps < lo95) + (reps > hi95))
  vA: m + alpha_hat * m^2
  vB: muB + alpha_hat * muB^2
  diff: muB - m
  se_p: sqrt(m / n + muB / n)
  z_p: diff / se_p
  p_p: 2 * (1 - normCdf(z_p))
  se_nb: sqrt(vA / n + vB / n)
  z_nb: diff / se_nb
  p_nb: 2 * (1 - normCdf(z_nb))

symbols:
  reps: {tex: 'x', says: the six replicate counts}
  m: {tex: '\bar{x}', says: the average of the replicates}
  v: {tex: 's^2', says: the spread of the replicates (variance)}
  mu: {tex: '\mu', says: the gene's average count}
  sd_p: {tex: '\mathrm{SD}_{\text{count}}', says: the spread counting alone gives}
  alpha: {tex: '\alpha', says: how much the true level wobbles, short: the wobble}
  alpha_hat: {tex: '\hat{\alpha}', says: 'α estimated from our six replicates'}
  v_nb: {tex: '\sigma^2', says: the variance of the counts}
  lam: {tex: '\lambda', says: a sample's true level (its own rate)}
  muB: {tex: '\mu_B', says: average count in the treated group}
  n: {tex: n, says: samples per group}
  vA: {tex: '\sigma^2_A', says: variance in the control group}
  vB: {tex: '\sigma^2_B', says: variance in the treated group}
  diff: {tex: '\Delta', says: the gap between the group averages}
  se_p: {tex: '\mathrm{SE}_{\text{Pois}}', says: noise in the gap (counting only)}
  se_nb: {tex: '\mathrm{SE}_{\text{NB}}', says: noise in the gap (with wobble)}
  z_p: {tex: 'z_{\text{Pois}}', says: the gap in noise units (counting only)}
  z_nb: {tex: 'z_{\text{NB}}', says: the gap in noise units (with wobble)}
abbr: {NB: negative binomial, SD: standard deviation, SE: standard error, DESeq2: a differential-expression tool, MAGeCK: a CRISPR-screen analysis tool, RNA: ribonucleic acid}

slides:
  - type: title

  - type: predict
    kind: pretest
    q: Six replicates average about 22 reads. If counting were the only noise, how far would a typical sample sit from 22?
    options:
      - about 5 reads
      - about 22 reads
      - about 50 reads
      - not sure
    answer: 0
    why: Counting noise spreads about √mean, so √22.5 ≈ **{{sdp|1}}** reads. Our replicates spread **{{s|1}}**, almost three times more. This deck is about that gap.

  - type: idea
    chapter: Counting noise
    introduces: [count, poisson]
    lead: Start simple. The true level never changes.
    title: Even a fixed rate gives counts that wobble
    points:
      - Each read lands on our gene by chance. That is **Poisson** noise.
    visual:
      chart:
        x: {label: reads in one sample, min: 0, max: 50}
        y: {label: chance of each count, min: 0, max: 0.1, fmt: 2}
        series:
          - {name: counting alone (Poisson), kind: bars, fn: 'poisPmf(x, m)', focus: true}
        marks:
          - {kind: vline, x: m, label: 'mean {{m|1}}', step: 1}
          - {kind: span, x: ['m - sdp', 'm + sdp'], y: 0.093, label: '±1 SD = ±{{sdp|1}}', step: 2}
      caption: Most bars sit within about ±5 reads of the mean.

  - type: equation
    uses: [poisson]
    lead: So how big is counting noise?
    title: Counting noise grows like the square root
    lhs: sd_p
    expr: sqrt(mu)
    terms: {mu: {value: m}}
    read: the spread from counting is the square root of the average
    code: sd = np.sqrt(mu)
    note: For our gene that is **{{sdp|1}}** reads. Keep this number.
    more: Poisson noise has variance equal to its mean, $\sigma^2 = \mu$. The SD is the square root of the variance, so $\mathrm{SD} = \sqrt{\mu}$.

  - type: idea
    chapter: Too much spread
    introduces: [overdispersion]
    lead: But our real replicates break that rule.
    title: Our replicates land outside the counting band
    visual:
      chart:
        x: {label: reads in one sample, min: 0, max: 50}
        y: {label: chance of each count, min: 0, max: 0.1, fmt: 2}
        series:
          - {name: counting alone (Poisson), kind: bars, fn: 'poisPmf(x, m)', color: mist}
          - {name: our 6 replicates, kind: dots, x: reps, y: 0.006, focus: true, step: 2}
        marks:
          - {kind: band, x: [lo95, hi95], label: where counting puts 95%, step: 1}
          - {kind: label, at: [44, 0.03], text: '{{nout}} of 6 outside', place: c, step: 3}
      caption: 'Their SD is {{s|1}} reads, not the {{sdp|1}} that counting allows.'

  - type: statement
    text: When replicates spread more than counting allows, the counts are ==overdispersed==.
    sub: 'Here the variance is {{v/m|1}} times the mean. Counting alone gives 1.'

  - type: idea
    lead: Is it only this gene? Look at 400.
    title: Almost every gene sits above the counting line
    visual:
      chart:
        x: {label: average count (log scale), min: 3, max: 10000, log: true}
        y: {label: variance (log scale), min: 1, max: 10000000, log: true}
        series:
          - {name: genes, kind: dots, x: gm, y: gv, color: mist}
        marks:
          - {kind: fn, fn: 'x', label: 'counting alone: variance = mean', step: 1, color: s1, labelAt: 0.92}
          - {kind: fn, fn: 'x + 0.1 * x^2', label: 'with wobble: μ + 0.1μ²', step: 2, color: accent, labelAt: 0.55}
          - {kind: point, x: m, y: v, label: our gene, step: 3}
      caption: '{{above|%0}} of 400 simulated genes sit above the counting line.'

  - type: bridge
    introduces: [mixture]
    lead: Why would the true level move? Think of a batter.
    title: A batter's form changes every match
    from: Cricket
    to: Sequencing
    pairs:
      - [boundaries in one match, reads in one sample]
      - [form on the day, "the sample's true level"]
      - [career average, the gene's average μ]
    breaks: Form drifts through a season. Replicate samples are independent.

  - type: idea
    lead: So the noise comes in two stages.
    title: Each sample wobbles, then counting adds noise
    visual:
      flow:
        nodes:
          - {label: 'gene average μ', sub: '{{m|1}} reads'}
          - {label: 'this sample''s level λ', sub: wobbles by α}
          - {label: reads counted, sub: 'Poisson around λ'}
        verbs: [wobbles, counted]
        focus: 1
        build: true
      caption: The lit stage is the one counting alone leaves out.

  - type: predict
    kind: check
    uses: [mixture]
    q: Two samples share the same true level, λ = 22.5. How far apart will their counts be?
    options:
      - about ±5 reads
      - about ±13 reads, like our replicates
      - exactly equal
    answer: 0
    why: 'Same level leaves only counting noise: SD ≈ √22.5 = **{{sdp|1}}**. Our extra spread came from **levels that differ**.'

  - type: idea
    introduces: [nb, alpha]
    uses: [mixture]
    lead: Now stack both stages and turn up the wobble.
    title: More wobble, wider counts
    points:
      - This two-stage curve is the **negative binomial** (NB).
    controls:
      - {name: alpha, label: 'wobble α', min: 0, max: 1, step: 0.05, value: 0.3}
    derive:
      v_now: m + alpha * m^2
    visual:
      chart:
        x: {label: reads in one sample, min: 0, max: 90}
        y: {label: chance of each count, min: 0, max: 0.09, fmt: 2}
        series:
          - {name: 'simulated samples', kind: hist, values: 'rnb(6000, m, alpha, 11)', density: true, color: s3, opacity: 0.55}
          - {name: counting alone, kind: line, fn: 'poisPmf(x, m)', discrete: true, color: mist, dash: true}
          - {name: negative binomial, kind: line, fn: 'nbPmf(x, m, alpha)', discrete: true, focus: true}
      caption: 'At α = 0 the curves match. Variance now {{v_now|0}}, against {{m|1}}.'

  - type: equation
    uses: [nb]
    lead: The two stages give one formula.
    title: Variance = counting part + wobble part
    lhs: v_nb
    expr: mu + alpha * mu^2
    terms:
      mu: {value: m}
      alpha: {value: alpha_hat}
    read: spread equals the mean, plus the wobble times the mean squared
    code: var = mu + alpha * mu**2
    note: 'The wobble part grows with $\mu^2$, so it rules busy genes.'
    more: 'Papers write $K \sim \mathrm{NB}(\mu, \alpha)$ with $\mathrm{Var}(K) = \mu + \alpha\mu^2$. Some use the size $r = 1/\alpha$ instead.'

  - type: calc
    uses: [alpha]
    lead: Where does α come from? Six numbers.
    title: Our replicates give α by subtraction
    given: 'Replicates: {{reps}}'
    lines:
      - {say: Average the replicates, expr: mean(reps), name: m}
      - {say: Measure their spread, expr: var(reps), name: v}
      - {say: 'Remove counting, divide by μ²', expr: (v - m) / m^2, name: alpha_hat}

  - type: idea
    lead: So which part matters more? It depends on the mean.
    title: Busy genes are ruled by the wobble
    visual:
      parts:
        items:
          - {label: 'counting part μ'}
          - {label: 'wobble part αμ²', focus: true}
        rows:
          - {label: 'μ = 5', values: [5, 'alpha_hat * 5^2']}
          - {label: 'μ = 22.5', values: [m, 'alpha_hat * m^2']}
          - {label: 'μ = 500', values: [500, 'alpha_hat * 500^2']}
          - {label: 'μ = 5,000', values: [5000, 'alpha_hat * 5000^2']}
        share: true
        build: true
      caption: The wobble's share grows with the mean, toward all of the variance.

  - type: predict
    kind: check
    q: A gene averages 1,000 reads with α = 0.28. Which part rules its variance?
    options:
      - the counting part
      - the wobble part
      - about equal
    answer: 1
    why: 'Counting gives 1,000. The wobble gives **{{0.28 * 1000^2|,}}**. Even very busy genes stay noisy.'
    visual:
      parts:
        items:
          - {label: counting, value: 1000}
          - {label: wobble, value: '0.28 * 1000^2', focus: true}
        fmt: ','

  - type: compare
    chapter: Why it matters
    lead: But why should a test care?
    title: Same data, two verdicts
    a:
      title: Poisson test
      tone: bad
      verdict: fooled
      text: Counting noise only.
      visual: {stat: {value: 'p = {{p_p|s2}}', label: '"a real change"'}}
    b:
      title: NB test
      tone: good
      verdict: honest
      text: Includes the wobble.
      visual: {stat: {value: 'p = {{p_nb|2}}', label: '"could be noise"'}}
    verdict: 'Underestimate the noise and **every** gene looks significant.'

  - type: calc
    lead: Where does the first verdict come from?
    title: Against counting noise, the gap looks big
    lines:
      - {say: The gap between the groups, expr: muB - m, name: diff}
      - {say: 'Noise in the gap, counting only', expr: sqrt(m / n + muB / n), name: se_p}
      - {say: The gap in noise units, expr: diff / se_p, name: z_p, fmt: 2}

  - type: calc
    lead: But the replicates showed bigger noise.
    title: Against the real noise, the gap shrinks
    given: 'Variances from μ + αμ²: control **{{vA|0}}**, treated **{{vB|0}}**.'
    lines:
      - {say: 'Noise in the gap, with wobble', expr: sqrt(vA / n + vB / n), name: se_nb}
      - {say: The same gap in noise units, expr: diff / se_nb, name: z_nb, fmt: 2}

  - type: idea
    lead: Put both on one yardstick.
    title: One gap, two yardsticks
    visual:
      chart:
        x: {label: the gap in noise units (z), min: -4, max: 4}
        y: {label: chance under pure noise, min: 0, max: 0.45, fmt: 1}
        series:
          - {name: pure noise, kind: line, fn: 'normPdf(x)', color: mist}
        marks:
          - {kind: area, fn: 'normPdf(x)', x: [1.96, 4], color: mist, label: 'rarest 5%', step: 1}
          - {kind: area, fn: 'normPdf(x)', x: [-4, -1.96], color: mist, step: 1}
          - {kind: vline, x: z_p, label: 'counting only: {{z_p|2}}', color: s1, step: 2}
          - {kind: vline, x: z_nb, label: 'with wobble: {{z_nb|2}}', color: accent, step: 3}
      caption: Against counting noise the gap looks rare; against the real noise it is ordinary.

  - type: recap
    answer: 'Each sample''s true level wobbles, so replicates spread more than counting allows. The negative binomial adds that wobble: variance = μ + αμ².'
    points:
      - Counting alone gives SD ≈ √mean.
      - Real replicates spread more (overdispersion).
      - The wobble part αμ² rules busy genes.
    breaks:
      - 'α from 6 samples is shaky: DESeq2 shrinks it toward a trend.'
      - Depth differences still need normalizing first.
    next:
      - DESeq2 dispersion shrinkage
      - The MAGeCK mean–variance model
      - Why counts get logged

  - type: map
    center: negative binomial
    links:
      - {to: Poisson, how: 'α = 0 gives counting alone', kind: special}
      - {to: 'gamma distribution', how: how the true level wobbles, kind: prereq}
      - {to: DESeq2, how: one α per gene, shrunk, kind: uses}
      - {to: MAGeCK, how: fits variance against the mean, kind: uses}
      - {to: a batter's form, how: a rate that changes daily, kind: analogy}
      - {to: log counts, how: 'tame the μ² growth', kind: sibling}

  - type: quiz
    cards:
      - {q: 'A gene averages 100 reads. What SD does counting alone give?', a: '√100 = **10** reads.'}
      - {q: 'What does α measure?', a: "How much each sample's true level wobbles around the gene's average.", tag: meaning}
      - {q: 'Why do Poisson tests give too many hits?', a: They miss the wobble, so ordinary gaps look significant., tag: reversed}
