<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091450"><title>Counts per million</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script><style>/* Lucid: Liquid Glass theme for learning decks, in the proff-viz mono palette.
   Black and greys carry everything; orange marks the slide headline and what matters now, never the background.
   Every colour is a token. Authors never edit this file: decks only carry content.
   Stage: 1600 x 900 (landscape) or 720 x 1280 (portrait), scaled to the screen. Sizes below are stage px. */

:root {
  /* proff-viz v5 mono: a near-black page under grey glass */
  --bg: #0b0c0e; --surf: #171819;

  /* text: ink on glass >= 7:1, mist >= 4.5:1, haze for ticks and eyebrows */
  --ink: #f2f2f0; --mist: #c2c0b9; --haze: #adaba4;

  /* orange: the headline and what matters now; tint for small warm labels; tint-lo for lines only, never text */
  --accent: #ff5a36; --tint: #ffb27f; --tint-lo: #6b4631; --accent-wash: rgba(255, 90, 54, .12);

  /* categorical series: proff c1 blue and c3 teal, plus a pink. All pairs, and each against the accent,
     pass the colour-blind check on the plate (see docs/design.md) */
  --s1: #7fb0ff; --s2: #5fdcc4; --s3: #cb85ae;
  /* status: always with an icon and a word */
  --good: #7ad9a0; --bad: #ff6f86;

  /* materials */
  --hair: rgba(255, 255, 255, .10); --hair-2: rgba(255, 255, 255, .22);
  --plate-solid: #161718;   /* dot rings and gaps inside charts */

  --r-xl: 44px; --r-lg: 32px; --r-md: 24px; --r-sm: 16px; --r-pill: 999px;
  --f-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
  --f-mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
  --pad-x: 84px; --pad-top: 128px; --pad-bot: 118px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); }
body {
  font-family: var(--f-ui); color: var(--ink); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "kern"; text-rendering: optimizeLegibility; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
b, strong { font-weight: 680; color: var(--ink); }
i, em { font-style: italic; }
code { font-family: var(--f-mono); font-size: .86em; padding: .06em .32em; border-radius: 8px; background: rgba(255, 255, 255, .09); }
mark.hi { color: inherit; background: none; font-weight: 680; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .13em; text-underline-offset: .2em; text-decoration-skip-ink: none; }

/* ---------- wallpaper: black, with soft grey silk for the glass to catch. No colour: orange belongs to the content ---------- */
#wall { position: fixed; inset: 0; overflow: hidden; z-index: 0;
  background: radial-gradient(120% 70% at 50% -12%, rgba(255, 255, 255, .045), transparent 62%),
    linear-gradient(180deg, #0e0f11 0%, #0b0c0e 48%, #08090a 100%); }
#wall .ribbons { position: absolute; inset: -8%; width: 116%; height: 116%; transition: transform 2s var(--ease); will-change: transform; }
#wall .orb { position: absolute; border-radius: 50%; transition: transform 2s var(--ease); will-change: transform; }
#wall .o1 { width: 60vmax; height: 60vmax; left: -18vmax; bottom: -26vmax; background: radial-gradient(circle, rgba(255, 255, 255, .055) 0%, transparent 62%); }
#wall .o2 { width: 44vmax; height: 44vmax; right: -14vmax; top: 14vmax; background: radial-gradient(circle, rgba(255, 255, 255, .04) 0%, transparent 64%); }
#wall .o3 { width: 150vmax; height: 34vmax; left: -10vmax; top: -24vmax; background: radial-gradient(closest-side, rgba(255, 255, 255, .035), transparent); }
#wall .o4 { width: 24vmax; height: 24vmax; left: 34vmax; top: 30vmax; background: radial-gradient(circle, rgba(255, 255, 255, .03) 0%, transparent 66%); }
#wall .grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; background-repeat: repeat; background-size: 220px 220px; pointer-events: none; }
#wall .vignette { position: absolute; inset: 0; background: radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(0, 0, 0, .6) 100%); }

/* ---------- stage ---------- */
#viewport { position: fixed; inset: 0; z-index: 1; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform-origin: center center; transform: translate(-50%, -50%); }
.port #stage { width: 720px; height: 1280px; }
.slide { position: absolute; inset: 0; padding: var(--pad-top) var(--pad-x) var(--pad-bot); display: none; flex-direction: column; gap: 30px; }
.slide.on { display: flex; }
.port .slide { --pad-x: 40px; --pad-top: 116px; --pad-bot: 132px; gap: 24px; }

/* ---------- glass: clear, lit at the rim ----------
   Liquid Glass reads as glass because of its edge: a bright specular line where light enters (top left), a fainter one
   where it leaves (bottom right), light caught inside the rim, and the world behind showing through, only softened. */
.g { position: relative; border-radius: var(--r-lg); isolation: isolate;
  background: linear-gradient(135deg, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, .035) 38%, rgba(255, 255, 255, .015) 62%, rgba(255, 255, 255, .05) 100%),
    rgba(24, 25, 27, .34);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  box-shadow:
    inset 1.5px 1.5px 1px -.5px rgba(255, 255, 255, .55),
    inset -1.5px -1.5px 1px -.5px rgba(255, 255, 255, .16),
    inset 0 0 0 1px rgba(255, 255, 255, .07),
    inset 0 16px 30px -18px rgba(255, 255, 255, .14),
    0 22px 60px -14px rgba(0, 0, 0, .75), 0 6px 16px -6px rgba(0, 0, 0, .55); }
.g::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
  background: linear-gradient(135deg, rgba(255, 255, 255, .7) 0%, rgba(255, 255, 255, .16) 22%, rgba(255, 255, 255, .02) 48%, rgba(255, 255, 255, .08) 76%, rgba(255, 255, 255, .34) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.g::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(165deg, rgba(255, 255, 255, .08) 0%, rgba(255, 255, 255, .02) 18%, transparent 34%),
    radial-gradient(90% 60% at 12% -8%, rgba(255, 255, 255, .09), transparent 55%); }
/* plate: the same glass, smoked, under data (charts, tables, formulas) so lines and numbers stay crisp */
.g.plate { background: linear-gradient(160deg, rgba(255, 255, 255, .06) 0%, rgba(255, 255, 255, .012) 40%, rgba(255, 255, 255, .025) 100%), rgba(20, 21, 23, .58);
  -webkit-backdrop-filter: blur(24px) saturate(130%); backdrop-filter: blur(24px) saturate(130%); }
/* warm: glass with an orange tint, for the one card that holds the answer */
.g.warm { background: linear-gradient(135deg, rgba(255, 90, 54, .14) 0%, rgba(255, 90, 54, .045) 45%, rgba(255, 178, 127, .05) 100%), rgba(26, 23, 22, .42); }
.g.warm::before { background: linear-gradient(135deg, rgba(255, 196, 160, .8) 0%, rgba(255, 140, 100, .2) 24%, rgba(255, 255, 255, .02) 50%, rgba(255, 255, 255, .08) 76%, rgba(255, 210, 180, .36) 100%); }
.g.coolbad::after { background: radial-gradient(110% 80% at 0% 0%, rgba(255, 111, 134, .12), transparent 55%); }
/* never glass on glass: a card inside a card is a quiet inset, not another pane */
.g .g:not(.opt):not(.cell):not(.node):not(.mn):not(.mi) { background: rgba(255, 255, 255, .05); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px rgba(255, 255, 255, .05); }
.g .g:not(.opt):not(.cell):not(.node):not(.mn):not(.mi)::before, .g .g:not(.opt):not(.cell):not(.node):not(.mn):not(.mi)::after { display: none; }
.g .vis.g { background: transparent; box-shadow: none; padding: 0; }
.g.thin { border-radius: var(--r-md); }
.g.pill { border-radius: var(--r-pill); }
.pad { padding: 34px 40px; }
.port .pad { padding: 26px 28px; }

/* ---------- type ---------- */
.lead { font-size: 28px; line-height: 1.3; font-weight: 520; color: var(--mist); max-width: 1300px; }
.lead .lw { color: var(--tint); font-weight: 680; }
.h1 { font-size: 58px; line-height: 1.08; font-weight: 720; letter-spacing: -.022em; max-width: 1420px; text-wrap: balance; color: var(--accent); }
.port .h1 { font-size: 46px; }
.port .lead { font-size: 26px; }
.eyebrow { font-size: 22px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--haze); }
.p, .pts li { font-size: 32px; line-height: 1.36; font-weight: 450; color: var(--ink); }
.port .p, .port .pts li { font-size: 30px; }
.small { font-size: 25px; line-height: 1.4; color: var(--mist); }
.cap { font-size: 26px; line-height: 1.38; color: var(--mist); }
.cap::before { content: "Look: "; color: var(--tint); font-weight: 650; }
.mono { font-family: var(--f-mono); }
.tex-fallback { font-family: var(--f-mono); color: var(--mist); }
.res, .res .katex { color: var(--accent); }

/* ---------- head and body ---------- */
.head { display: flex; flex-direction: column; gap: 10px; flex: none; }
.slide > .body { flex: 1; min-height: 0; display: flex; gap: 40px; align-items: stretch; }
/* the visual is the slide: words get a narrow column beside it */
.body.split > .col-text { flex: 0 0 31%; display: flex; flex-direction: column; justify-content: safe center; gap: 22px; min-width: 0; }
.body.split > .col-vis { flex: 1; min-width: 0; display: flex; }
.body.split.vis-left { flex-direction: row-reverse; }
.body.stack, .body.wide { flex-direction: column; gap: 22px; }
.body.stack > .col-vis, .body.wide > .col-vis { flex: 1; min-height: 0; display: flex; }
.body.stack > .col-text, .body.wide > .col-text { flex: none; }
.body.text-only { flex-direction: column; justify-content: safe center; }
.port .body.split { flex-direction: column; }
.port .body.split > .col-text { flex: none; }
.port .body.split > .col-vis { flex: 1; min-height: 0; }

/* points */
.pts { list-style: none; display: flex; flex-direction: column; gap: 18px; }
.pts li { display: grid; grid-template-columns: 22px 1fr; column-gap: 16px; align-items: baseline; }
.pts .pip { width: 14px; height: 14px; border-radius: 50%; background: var(--mist); opacity: .5; transform: translateY(-3px); transition: all .4s var(--ease); }
.pts li.now .pip { background: var(--accent); opacity: 1; box-shadow: 0 0 0 6px rgba(255, 90, 54, .18); }
.textcard { padding: 34px 40px; display: flex; flex-direction: column; gap: 22px; justify-content: safe center; }
.port .textcard { padding: 26px 28px; }

/* build steps: materialize (blur to sharp, slight scale), like Liquid Glass objects */
[data-step] { opacity: 0; filter: blur(10px); transform: translateY(8px) scale(.985); transition: opacity .5s var(--ease), filter .5s var(--ease), transform .55s var(--spring); }
[data-step].shown { opacity: 1; filter: none; transform: none; }
.fitting [data-step] { transform: none !important; transition: none !important; }   /* measure the real layout, not the 8px entry offset */
[data-only] { display: none; }
[data-only].shown { display: block; }
.no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; animation: none !important; }
.slide.on .enter { animation: materialize .7s var(--ease) both; }
.slide.on .enter:nth-child(2) { animation-delay: .06s; } .slide.on .enter:nth-child(3) { animation-delay: .12s; }
@keyframes materialize { from { opacity: 0; filter: blur(14px); transform: scale(.975); } to { opacity: 1; filter: none; transform: none; } }
/* a slide whose content runs long is zoomed down a little (deck.js sets it); the audit reports big shrinks */
.slide > .body, .slide > .predict, .slide > .eqwrap, .slide > .bridge, .slide > .compare, .slide > .quiz, .slide > .recap, .slide > .mapw { transform-origin: top left; }

/* ---------- chrome: chapters capsule, counter, progress, nav ---------- */
#chrome { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
#chrome > * { pointer-events: auto; }
.chapters { position: absolute; top: 36px; left: var(--pad-x); display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 1180px; overflow: hidden; }
.chapters .seg { font-size: 21px; font-weight: 600; color: var(--haze); padding: 10px 20px; border-radius: var(--r-pill); white-space: nowrap; transition: all .45s var(--ease); }
.chapters .seg.done { color: var(--mist); }
.chapters .seg.now { color: var(--ink); background: rgba(255, 255, 255, .13); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 6px 18px -6px rgba(0, 0, 0, .5); }
.chapters .seg.now::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 10px; transform: translateY(-2px); }
.chapters .chn { display: none; font-size: 21px; color: var(--haze); padding-right: 14px; font-variant-numeric: tabular-nums; }
.counter { position: absolute; top: 36px; right: var(--pad-x); font-size: 21px; font-weight: 600; color: var(--mist); padding: 14px 22px; font-variant-numeric: tabular-nums; }
.progress { position: absolute; left: var(--pad-x); right: calc(var(--pad-x) + 170px); bottom: 54px; display: flex; gap: 8px; height: 6px; }
.progress .pc { flex: 1; border-radius: 6px; background: rgba(255, 255, 255, .11); overflow: hidden; }
.progress .pc i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--accent); transition: width .6s var(--ease); }
.stepdots { position: absolute; left: var(--pad-x); bottom: 76px; display: flex; gap: 9px; }
.stepdots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .22); transition: all .35s var(--ease); }
.stepdots i.on { background: var(--mist); }
.stepdots i.now { background: var(--accent); width: 26px; border-radius: 6px; }
.navbtns { position: absolute; right: var(--pad-x); bottom: 30px; display: flex; gap: 14px; }
.navbtns button { width: 66px; height: 66px; display: grid; place-items: center; }
.navbtns svg { width: 28px; height: 28px; stroke: var(--ink); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.navbtns button:disabled { opacity: .35; cursor: default; }
.navbtns button:active:not(:disabled) { transform: scale(.94); }
.morebtn { position: absolute; top: 36px; right: calc(var(--pad-x) + 130px); font-size: 21px; font-weight: 620; color: var(--ink); padding: 14px 24px; display: none; }
.morebtn.show { display: block; }
.port .chapters { left: 24px; top: 28px; right: auto; max-width: none; }
.port .chapters .seg:not(.now) { display: none; }
.port .chapters .chn { display: inline; }
.port .chapters:not(:has(.now)) { visibility: hidden; }   /* title slide: no empty capsule */
.port .counter { top: 28px; right: 24px; display: none; }
.port .progress { left: 120px; right: 120px; bottom: 58px; }
.port .stepdots { left: 50%; transform: translateX(-50%); bottom: 82px; }
.port .navbtns { left: 24px; right: 24px; bottom: 26px; justify-content: space-between; }
.port .navbtns button { width: 72px; height: 72px; }
.port .morebtn { top: 28px; right: 24px; padding: 12px 20px; }

/* more sheet: detail the slide does not need on its face (said aloud, code, extra notes) */
.sheet { position: absolute; left: 50%; top: 110px; width: min(1100px, calc(100% - 2 * var(--pad-x))); max-height: calc(100% - 240px); overflow: auto;
  transform: translate(-50%, -30px); opacity: 0; pointer-events: none; transition: all .45s var(--spring); padding: 34px 42px; z-index: 30;
  background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02)), rgba(20, 21, 23, .9); }
.sheet.open { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.sheet .eyebrow { margin-bottom: 12px; }
.sheetbody { display: flex; flex-direction: column; gap: 18px; }
.sheetbody .say { font-style: italic; color: var(--mist); }
.sheetbody .codebox { font-size: 25px; white-space: pre-wrap; }

/* ---------- title, chapter, statement ---------- */
.s-title { justify-content: center; gap: 34px; }
.s-title .kicker { font-size: 24px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--tint); }
.s-title .display { font-size: 104px; line-height: 1.0; font-weight: 760; letter-spacing: -.035em; max-width: 1300px; text-wrap: balance; color: var(--accent); }
.s-title .subtitle { font-size: 34px; line-height: 1.35; color: var(--mist); max-width: 1100px; }
.s-title .question { display: flex; align-items: center; gap: 26px; padding: 28px 36px 28px 28px; max-width: 1180px; }
.s-title .question .qmark { flex: none; width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 40px; font-weight: 750; color: #1a0802;
  background: radial-gradient(circle at 35% 30%, #ffd2b8, var(--accent) 58%, #c43b1c); box-shadow: 0 0 26px rgba(255, 90, 54, .35); }
.s-title .question .qt { font-size: 34px; line-height: 1.32; font-weight: 560; }
.s-title .chips { display: flex; flex-wrap: wrap; gap: 12px; }
.s-title .chips span { font-size: 22px; font-weight: 600; color: var(--mist); padding: 10px 20px; }
.port .s-title .display { font-size: 72px; }
.port .s-title .subtitle { font-size: 30px; }
.port .s-title .question .qt { font-size: 30px; }

.s-statement { justify-content: center; align-items: center; text-align: center; }
.s-statement .big { font-size: 72px; line-height: 1.14; font-weight: 680; letter-spacing: -.025em; max-width: 1280px; text-wrap: balance; }
.s-statement .sub { font-size: 32px; color: var(--mist); max-width: 1000px; margin-top: 26px; }
.s-statement .g { padding: 70px 90px; }
.s-chapter .big { color: var(--accent); }
.port .s-statement .big { font-size: 50px; }
.port .s-statement .g { padding: 44px 34px; }

/* ---------- visuals ---------- */
.vis { flex: 1; min-width: 0; min-height: 0; position: relative; display: flex; flex-direction: column; }
.vis.g { padding: 26px 30px 22px; }
.vis .cap { margin-top: 8px; flex: none; }
.vis > .codebox { margin: auto 0; }
.vis.vis-code { flex: none; align-self: center; width: 100%; }
.col-vis:has(> .vis-code) { align-items: center; }
.vhead { display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; flex: none; margin-bottom: 6px; min-height: 40px; }
.vhead.empty { display: none; }
.vhead .legend { position: static; flex: 1 1 auto; }
.vhead .controls { margin-top: 0; flex: none; }
.vfoot { display: flex; align-items: center; gap: 18px 28px; flex-wrap: wrap; flex: none; margin-top: 10px; }
.vfoot .cap { flex: 1 1 340px; margin-top: 0; }
.vfoot .controls { margin-top: 0; }
.vfoot .datatoggle { position: static; margin-left: auto; flex: none; }

/* chart */
.chart { position: relative; flex: 1; min-height: 0; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.chart text { font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
.chart .tick { font-size: 22px; fill: var(--haze); }
.chart .axt { font-size: 24px; fill: var(--mist); font-weight: 560; }
.chart .lbl { font-size: 24px; fill: var(--ink); font-weight: 600; }
.chart .lbl.dim { fill: var(--mist); font-weight: 520; }
.chart .grid { stroke: var(--hair); stroke-width: 1; }
.chart .base { stroke: rgba(240, 240, 236, .42); stroke-width: 1.6; }
.chart .mk { transition: opacity .5s var(--ease); }
.chart .mk.off { opacity: 0; }
.legend { position: absolute; top: 0; left: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 22px; color: var(--mist); pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 9px; }
.legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; }
.legend i.dot { width: 13px; height: 13px; border-radius: 50%; }
.legend i.bar { width: 14px; height: 18px; border-radius: 4px 4px 1px 1px; }
.tip { position: absolute; pointer-events: none; z-index: 5; padding: 12px 16px; font-size: 22px; line-height: 1.35; color: var(--ink); opacity: 0; transition: opacity .15s;
  border-radius: 16px; background: rgba(22, 23, 25, .9); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 12px 30px rgba(0, 0, 0, .55), inset 0 1px 0 rgba(255, 255, 255, .22); white-space: nowrap; }
.tip.on { opacity: 1; }
.tip b { font-variant-numeric: tabular-nums; }
.datatoggle { position: absolute; top: 14px; right: 16px; z-index: 4; font-size: 21px; font-weight: 620; color: var(--mist); padding: 8px 16px; border-radius: var(--r-pill);
  background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2); }
.datatoggle:hover { color: var(--ink); background: rgba(255, 255, 255, .14); }
.datatable { position: absolute; inset: 0; overflow: auto; display: none; padding: 10px 6px; }
.vis.showdata .datatable { display: block; }
.vis.showdata .chart svg, .vis.showdata .legend { visibility: hidden; }
.datatable table { border-collapse: collapse; font-size: 22px; font-variant-numeric: tabular-nums; }
.datatable th, .datatable td { padding: 6px 16px; text-align: right; border-bottom: 1px solid var(--hair); color: var(--mist); }
.datatable th { color: var(--haze); font-weight: 600; text-align: right; }

/* controls (sliders) */
.controls { display: flex; flex-wrap: wrap; gap: 14px 30px; margin-top: 10px; flex: none; }
.ctl { display: flex; align-items: center; gap: 16px; padding: 10px 22px; }
.ctl label { font-size: 23px; font-weight: 600; color: var(--mist); white-space: nowrap; }
.ctl output { font-size: 24px; font-weight: 700; color: var(--accent); min-width: 3.4ch; font-variant-numeric: tabular-nums; }

  background: radial-gradient(circle at 35% 30%, #fff, #ecebe8 60%, #c9c7c2); box-shadow: 0 4px 14px rgba(0, 0, 0, .6), inset 0 -2px 3px rgba(0, 0, 0, .15); }
.ctl input[type=range]::-moz-range-track { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, .16); }

.port .ctl input[type=range] { width: 220px; }

/* stat: the one number of a slide, in the accent (proff's hero) */

/* parts: a whole split into named pieces, one bar per row */

.parts .pv { font-size: 30px; fill: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.flow .node .ns { font-size: 24px; color: var(--mist); line-height: 1.25; }

.flow svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.flow .verb { font-size: 22px; fill: var(--mist); font-style: italic; }
.flow .edge { stroke: rgba(240, 240, 236, .45); stroke-width: 2.5; fill: none; }

/* code */
.codebox { font-family: var(--f-mono); font-size: 27px; line-height: 1.55; padding: 22px 28px; border-radius: var(--r-md); background: rgba(0, 0, 0, .42);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 0 0 1px rgba(255, 255, 255, .06); white-space: pre; overflow: hidden; color: var(--mist); }
.codebox .ck { color: #a9c0ff; } .codebox .cn { color: var(--tint); } .codebox .cc { color: var(--haze); font-style: italic; }
.codebox .tu { color: var(--ink); text-decoration: underline; text-decoration-thickness: 4px; text-underline-offset: 7px; text-decoration-color: var(--tc); }

/* images */
.imgbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.imgbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: var(--r-md); }

/* ---------- equation: the formula is the figure; each term is named right under it ---------- */
.s-equation .eqwrap { display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 34px; padding: 36px 46px 30px; flex: 1; min-height: 0; }
.eqmain { position: relative; display: flex; justify-content: center; align-items: center; font-size: 64px; max-width: 100%; }
.s-equation .eqmain { font-size: 78px; align-self: stretch; }   /* full width: fitEq shrinks the formula only when the row is too narrow */
.eqmain .katex { font-size: 1em; }
.eqmain .katex-display { margin: 0; }
.port .s-equation .eqmain { font-size: 52px; }
.ul { position: absolute; height: 6px; border-radius: 6px; background: var(--tc); transform-origin: left center; transition: transform .5s var(--spring), opacity .4s; pointer-events: none; }
.ul.off { transform: scaleX(0); opacity: 0; }
.halo { position: absolute; border-radius: 14px; background: color-mix(in srgb, var(--tc) 18%, transparent); transition: all .45s var(--ease); pointer-events: none; }
.halo.off { opacity: 0; transform: scale(.9); }
.tlab { position: absolute; font-size: 25px; font-weight: 620; line-height: 1.2; color: var(--ink); text-align: center; max-width: 12em; width: max-content; transform: translateX(-50%);
  transition: opacity .45s var(--ease), filter .45s var(--ease); }
.tlab .eg { display: block; font-size: 22px; font-weight: 520; color: var(--mist); margin-top: 2px; font-variant-numeric: tabular-nums; }
.tlab .lk { position: absolute; left: 50%; bottom: 100%; width: 2px; background: var(--hair-2); }
.tlab.off { opacity: 0; filter: blur(6px); }
.port .tlab { font-size: 22px; max-width: 7.6em; }
.port .tlab .eg { font-size: 20px; }
.eqnum { position: relative; display: flex; align-items: center; justify-content: center; gap: 26px; font-size: 44px; max-width: 100%; }
.eqnum .tag { flex: none; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--haze); }
.port .eqnum { flex-direction: column; gap: 8px; font-size: 32px; }
.eqso { font-size: 29px; line-height: 1.36; color: var(--mist); text-align: center; max-width: 1150px; }
.eqso b, .eqso strong { color: var(--ink); }
.port .eqso { font-size: 26px; }

/* ---------- calc: named working, one line per step ---------- */
.calc { display: flex; flex-direction: column; gap: 16px; padding: 30px 38px; flex: 1; min-height: 0; justify-content: safe center; }
.cline { display: grid; grid-template-columns: 54px 1fr; column-gap: 22px; row-gap: 6px; align-items: center; }
.cline .num { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; font-weight: 700; color: var(--ink);
  background: rgba(255, 255, 255, .11); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28); }
.cline.now .num { background: var(--accent); color: #1a0802; }
.cline .say { font-size: 28px; color: var(--ink); font-weight: 520; }
.cline .math { grid-column: 2; display: flex; align-items: flex-start; flex-wrap: wrap; gap: 6px 18px; font-size: 36px; position: relative; }
.cline .math .part { position: relative; display: inline-block; }
.cline .math .eqs { color: var(--haze); }
.oplab { position: absolute; font-size: 21px; font-weight: 600; color: var(--mist); max-width: 15em; width: max-content; transform: translateX(-50%); text-align: center; line-height: 1.15; }
.oplab::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 6px; background: var(--hair-2); }
.port .cline .math { font-size: 28px; }

/* ---------- table ---------- */
.s-table .body { gap: 30px; }
.tblwrap { flex: 1; min-width: 0; padding: 26px 30px; display: flex; flex-direction: column; justify-content: safe center; }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-variant-numeric: tabular-nums; }
table.t th { font-size: 21px; font-weight: 650; letter-spacing: .04em; color: var(--haze); text-align: right; padding: 10px 18px 14px; vertical-align: bottom; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t th .fx { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-right: 8px; border-radius: 9px; font-size: 22px; font-style: italic; font-weight: 700;
  color: #1a0802; background: var(--accent); transform: translateY(-2px); }
table.t th.der { color: var(--ink); cursor: pointer; }
table.t td { font-size: 28px; padding: 13px 18px; text-align: right; color: var(--ink); border-top: 1px solid var(--hair); }
table.t tr.focus td { background: var(--accent-wash); }

table.t td.der { color: var(--ink); font-weight: 600; }
table.t td.der.pend, table.t th.der.pend { opacity: 0; }
table.t .now { color: var(--accent) !important; }
.recipe { flex: 0 0 36%; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px; justify-content: safe center; position: relative; min-width: 0; }
.recipe .rk { display: none; flex-direction: column; gap: 14px; }
.recipe .rk.shown { display: flex; }
.recipe .rname { font-size: 30px; font-weight: 680; }
.recipe .rsays { font-size: 26px; color: var(--mist); line-height: 1.35; }
.recipe .rf { font-size: 34px; }
.recipe .rw { font-size: 30px; position: relative; padding-bottom: 30px; }
/* table too wide for a side recipe: the recipe goes under it */
.s-table .body.stacked { flex-direction: column; }
.s-table .body.stacked .recipe { flex: none; }
.land .s-table .body.stacked .recipe .rk.shown { display: grid; grid-template-columns: auto 1fr; column-gap: 34px; row-gap: 8px; align-items: baseline; }
.land .s-table .body.stacked .recipe .rk .eyebrow { grid-column: 1 / -1; }
.land .s-table .body.stacked .recipe .rw { grid-column: 1 / -1; }
.port .s-table .body { flex-direction: column; }
.port .recipe { flex: none; }
.port table.t td { font-size: 25px; padding: 10px 8px; }
.port table.t th { font-size: 21px; padding: 8px 8px 10px; white-space: normal; line-height: 1.15; }
.port .tblwrap { padding: 18px 14px; }

/* ---------- bridge ---------- */
.bridge { flex: 1; display: flex; flex-direction: column; gap: 20px; min-height: 0; justify-content: safe center; }
.bridge .worlds, .bridge .pair { display: grid; grid-template-columns: 1fr 86px 1fr; align-items: center; }
.bridge .world { justify-self: stretch; text-align: center; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--haze); padding: 6px 0; }
.bridge .world.to { color: var(--tint); }
.bridge .cell { padding: 20px 28px; font-size: 29px; line-height: 1.28; text-align: center; }
.bridge .eqv { text-align: center; font-size: 40px; color: var(--ink); font-weight: 600; }
.bridge .breaks { margin-top: 8px; display: flex; gap: 18px; align-items: flex-start; padding: 22px 30px; }
.bridge .breaks .bi { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #2a0f0c; background: var(--bad); margin-top: 2px; }
.bridge .breaks .bt { font-size: 27px; line-height: 1.35; }
.bridge .breaks .bt b { color: var(--ink); }
.port .bridge .worlds, .port .bridge .pair { grid-template-columns: 1fr 48px 1fr; }
.port .bridge .cell { padding: 14px 14px; font-size: 24px; }

/* ---------- compare ---------- */
.compare { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 36px; min-height: 0; }
.compare .side { padding: 30px 36px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.compare .tone { display: inline-flex; align-items: center; gap: 12px; font-size: 23px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink) !important; }
.compare .tone i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 20px; font-weight: 900; color: #04150c; }
.compare .tone.good i { background: var(--good); }
.compare .tone.bad i { background: var(--bad); color: #2a0f0c; }
.compare .side h3 { font-size: 36px; font-weight: 680; letter-spacing: -.01em; }
.compare .side .vis { flex: none; min-height: auto; }
.compare .side .stat { flex: none; padding: 12px 22px 14px; }
.compare .stat .num { font-size: 92px; }
.verdict { flex: none; padding: 22px 32px; font-size: 29px; line-height: 1.35; }
.verdict b { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .13em; text-underline-offset: .2em; text-decoration-skip-ink: none; }
.port .compare { grid-template-columns: 1fr; grid-template-rows: auto auto; align-content: start; gap: 20px; }
.port .compare .stat .num { font-size: 64px; }

/* ---------- predict ---------- */
.predict { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; min-height: 0; }

.opt:hover:not(:disabled) { transform: translateX(6px); }
.opt .ol { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 750;
  background: rgba(0, 0, 0, .34); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .12); }
.opt .om { font-size: 26px; font-weight: 800; text-align: center; }

.port .predict { grid-template-columns: 1fr; gap: 20px; }
.port .opt { font-size: 26px; padding: 14px 16px; grid-template-columns: 42px 1fr 30px; }

.flip .face .hint { font-size: 22px; color: var(--mist); margin-top: 10px; }
.port .quiz { grid-template-columns: 1fr; max-height: none; gap: 20px; align-content: start; grid-auto-rows: minmax(190px, auto); }
.port .flip .face { padding: 24px 26px; gap: 10px; }
.port .flip .face .q { font-size: 27px; }

/* ---------- recap: the answer, then what to keep and where it breaks ---------- */
.recap { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; align-content: safe center; align-items: start; gap: 26px; min-height: 0; }

.recap .answer .ap { font-size: 36px; line-height: 1.3; font-weight: 600; }

.recap .box .pts li { font-size: 28px; line-height: 1.36; }
.recap .box .pts { gap: 12px; }
.port .recap { grid-template-columns: 1fr; grid-template-rows: none; }
.port .recap .answer { flex-direction: column; align-items: flex-start; gap: 12px; }

/* ---------- map ---------- */
.mapw { position: relative; flex: 1; min-height: 0; }
.mapw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

.mapw .mn .mt { font-size: 30px; font-weight: 650; line-height: 1.2; }

.mapw .mn .mh { font-size: 22px; color: var(--ink); line-height: 1.25; margin-top: 4px; }
.mapw .mn.center { padding: 24px 34px; box-shadow: 0 0 0 3px var(--accent), 0 0 34px rgba(255, 90, 54, .25), 0 24px 60px -16px rgba(0, 0, 0, .6); }
.mapw .mn.center .mt { font-size: 34px; }

.mapw .edge.analogy { stroke-dasharray: 8 9; }

/* ---------- vibrancy: text on clear glass carries a faint dark halo, so it holds when brighter light passes behind ---------- */
.g, .g *, .lead, .h1, .head .eyebrow { text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }

    const limit = node.clientHeight - parseFloat(getComputedStyle(node).paddingBottom);
    // under zoom, offsetTop and heights come back in the element's own (zoomed) units
    const offTop = el => { let t = 0; for (let n = el; n && n !== node; n = n.offsetParent) t += n.offsetTop; return t; };
    // how far a box's in-flow content runs past its content edge, into its bottom padding or beyond
    // (Chrome's scrollHeight misses this for grid and flex items that stick out, so measure the children)
    const spill = c => { const kids = [...c.children].filter(k => k.offsetParent && getComputedStyle(k).position !== 'absolute'); if (!kids.length) return -1e9;
      return Math.max(...kids.map(k => offTop(k) + k.offsetHeight)) - (offTop(c) + c.offsetHeight - (parseFloat(getComputedStyle(c).paddingBottom) || 0)); };
    const boxes = main.flatMap(e => [e, ...e.querySelectorAll('.g')]);
    const over = z => { main.forEach(e => e.style.zoom = z === 1 ? '' : z);
      return Math.max(Math.max(...main.map(e => offTop(e) + Math.max(e.scrollHeight, e.offsetHeight))) * z - limit, ...boxes.map(c => spill(c) * z)); };
    const TOL = 2;   // .fitting drops the entry offset of hidden steps, so this is rounding only
    node.classList.add('fitting');
    if (over(1) > TOL) {
      let lo = .7, hi = 1;
      for (let i = 0; i < 7; i++) { const mid = (lo + hi) / 2; if (over(mid) <= TOL) lo = mid; else hi = mid; }
      over(lo); sl.zoom = lo;
    }
    node.classList.remove('fitting');
  }

  // ---------- slides ----------
  let stage, chrome;
  function build(deck) {
    L.deck = deck;
    const g = L.scope(null, {});
    Object.assign(g, deck.data || {});
    if (window.LUCID_DATA) Object.assign(g, window.LUCID_DATA);
    L.derive(g, deck.derive, 'deck');
    L.global = g;
    // chapters: listed, or taken from slides in order
    let chs = deck.chapters ? [...deck.chapters] : [];
    let cur = null;
    deck.slides.forEach(s => { if (s.type === 'chapter' && !s.chapter) s.chapter = s.title; if (s.chapter) { cur = s.chapter; if (!chs.includes(cur)) chs.push(cur); } s._ch = cur; });
    L.chapters = chs;
    deck.slides.forEach((s, i) => {
      const scope = L.scope(g, {});
      const ctx = { index: i, deck, scope, symbols: deck.symbols || {}, charts: [], later: [], ctl: {}, k: 0 };
      (s.controls || (s.visual && s.visual.chart && s.visual.chart.controls) || []).forEach(c => scope[c.name] = c.value ?? c.min);
      const rederive = () => L.derive(scope, s.derive, `slide ${i + 1}`);
      rederive();
      const type = L.types[s.type || 'idea'];
      let r;
      if (!type) { L.err(`slide ${i + 1}`, `unknown type "${s.type}"`); r = { node: h('section', 'slide'), steps: 0 }; }
      else { try { r = type(s, ctx); } catch (e) { L.err(`slide ${i + 1}`, e.message); console.error(e); r = { node: h('section', 'slide', `<div class="h1">Slide ${i + 1} failed: ${L.esc(e.message)}</div>`), steps: 0 }; } }
      r.node.dataset.i = i;
      const sl = { s, r, ctx, k: 0, laid: false, steps: r.steps || 0 };
      ctx.refresh = () => { rederive(); draw(sl); };
      Object.defineProperty(ctx, 'k', { get: () => sl.k });
      L.slides.push(sl); stage.appendChild(r.node);
    });
  }

  function chromeBuild() {
    chrome = h('div'); chrome.id = 'chrome';
    const chs = L.chapters;
    chrome.innerHTML = `${chs.length ? `<div class="chapters g pill thin"><span class="chn"></span>${chs.map((c, i) => `<span class="seg" data-c="${i}">${L.esc(c)}</span>`).join('')}</div>` : ''}
      <div class="counter g pill thin"></div>
      <div class="progress">${(chs.length ? chs : ['all']).map(() => '<div class="pc"><i></i></div>').join('')}</div>
      <div class="stepdots"></div>
      <button class="morebtn g pill thin">+ more</button>
      <div class="navbtns"><button class="g pill thin prev" aria-label="previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="g pill thin next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
      <div class="sheet g"><div class="eyebrow">Deeper</div><div class="p sheetbody"></div></div>`;
    stage.appendChild(chrome);
    chrome.querySelector('.prev').onclick = e => { e.stopPropagation(); back(); };
    chrome.querySelector('.next').onclick = e => { e.stopPropagation(); fwd(); };
    chrome.querySelector('.morebtn').onclick = e => { e.stopPropagation(); chrome.querySelector('.sheet').classList.toggle('open'); };
    chrome.querySelector('.sheet').onclick = e => e.stopPropagation();
  }
  function chromeUpdate() {
    const sl = L.slides[L.i], chs = L.chapters, ci = chs.indexOf(sl.s._ch);
    chrome.querySelectorAll('.chapters .seg').forEach((e, i) => { e.classList.toggle('now', i === ci); e.classList.toggle('done', i < ci); });
    const chn = chrome.querySelector('.chn'); if (chn) chn.textContent = ci >= 0 ? `${ci + 1}/${chs.length}` : '';
    chrome.querySelector('.counter').textContent = `${L.i + 1} / ${L.slides.length}`;
    const pcs = chrome.querySelectorAll('.progress .pc i');
    if (chs.length) chs.forEach((c, j) => { const idx = L.slides.map((x, n) => x.s._ch === c ? n : -1).filter(n => n >= 0); const done = idx.filter(n => n <= L.i).length; pcs[j].style.width = (idx.length ? done / idx.length * 100 : 0) + '%'; });
    else pcs[0].style.width = ((L.i + 1) / L.slides.length * 100) + '%';
    const dots = chrome.querySelector('.stepdots'); dots.innerHTML = sl.steps > 1 ? Array.from({ length: sl.steps }, (_, j) => `<i class="${j + 1 < sl.k ? 'on' : j + 1 === sl.k ? 'now' : ''}"></i>`).join('') : '';
    chrome.querySelector('.prev').disabled = L.i === 0 && sl.k <= minStep(sl);
    chrome.querySelector('.next').disabled = L.i === L.slides.length - 1 && sl.k >= sl.steps;
    const more = chrome.querySelector('.morebtn'), sheet = chrome.querySelector('.sheet');
    const extra = sl.r.more || '';   // what a renderer moved off the slide's face (said aloud, code, next steps)
    more.classList.toggle('show', !!(sl.s.more || extra)); sheet.classList.remove('open');
    if (sl.s.more || extra) { chrome.querySelector('.sheetbody').innerHTML = extra + (sl.s.more ? `<div>${L.md(sl.s.more)}</div>` : ''); L.fill(sheet, sl.ctx.scope); }
  }

  const minStep = sl => sl.steps > 0 ? 1 : 0;
  function apply(sl) {
    const k = sl.k;
    sl.r.node.querySelectorAll('[data-step]').forEach(e => e.classList.toggle('shown', +e.dataset.step <= k));
    sl.r.node.querySelectorAll('[data-only]').forEach(e => e.classList.toggle('shown', +e.dataset.only === k));
    sl.r.show && sl.r.show(k);
  }
  L.go = function (i, k) {
    i = Math.max(0, Math.min(L.slides.length - 1, i | 0));
    const prev = L.slides[L.i];
    if (prev && prev !== L.slides[i]) prev.r.node.classList.remove('on');
    L.i = i; const sl = L.slides[i];
    sl.k = k == null ? minStep(sl) : k < 0 ? sl.steps : Math.max(minStep(sl), Math.min(sl.steps, k));
    sl.r.node.classList.add('on');
    layoutCurrent(); apply(sl); chromeUpdate(); drift(i);
    if (!CHECK) history.replaceState(null, '', `#${i + 1}${sl.k > 1 ? '.' + sl.k : ''}`);
  };
  function fwd() { const sl = L.slides[L.i]; if (sl.k < sl.steps) { sl.k++; apply(sl); chromeUpdate(); } else if (L.i < L.slides.length - 1) L.go(L.i + 1); }
  function back() { const sl = L.slides[L.i]; if (sl.k > minStep(sl)) { sl.k--; apply(sl); chromeUpdate(); } else if (L.i > 0) L.go(L.i - 1, -1); }
  L.next = fwd; L.prev = back;

  function bindInput() {
    addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target.tagName === 'INPUT' && !/Arrow(Up|Down)/.test(e.key) && e.target.type === 'range' && /Arrow(Left|Right)/.test(e.key)) return;
      const sl = L.slides[L.i];
      if (sl.ctx.keys && sl.ctx.keys(e)) return;
      if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); fwd(); }
      else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); back(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); L.go(L.i + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); L.go(L.i - 1); }
      else if (e.key === 'Home') L.go(0); else if (e.key === 'End') L.go(L.slides.length - 1, -1);
      else if (e.key === 'm') chrome.querySelector('.morebtn.show')?.click();
      else if (e.key === 'd') sl.r.node.querySelector('.datatoggle')?.click();
    });
    let x0 = null, y0 = null, t0 = 0;
    addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; t0 = Date.now(); });
    addEventListener('pointerup', e => {
      if (x0 == null) return; const dx = e.clientX - x0, dy = e.clientY - y0; const tgt = e.target;
      const interactive = tgt.closest('button,input,a,.opt,.flip,.chart svg,.datatable,.sheet,.recipe th,.tblwrap');
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && !tgt.closest('input')) (dx < 0 ? fwd : back)();
      else if (!interactive && Math.abs(dx) < 8 && Math.abs(dy) < 8 && Date.now() - t0 < 500) (e.clientX < innerWidth * .3 ? back : fwd)();
      x0 = null;
    });
    addEventListener('resize', fit);
  }

  // ---------- audit: what check.py reads, per slide and step ----------
  L.audit = function () {
    const sl = L.slides[L.i], out = [], node = sl.r.node, sr = stage.getBoundingClientRect(), s = L.scale;
    const toStage = r => ({ x0: (r.left - sr.left) / s, y0: (r.top - sr.top) / s, x1: (r.right - sr.left) / s, y1: (r.bottom - sr.top) / s });
    const visible = e => { if (!e.getClientRects().length) return false; let n = e; while (n && n !== node) { const cs = getComputedStyle(n); if (cs.visibility === 'hidden' || cs.display === 'none' || +cs.opacity < .05) return false; n = n.parentElement; } return true; };
    // text blocks: block-level boxes holding text (inline runs belong to their block), KaTeX roots, positioned labels
    const hasText = e => (e.textContent || '').trim().length > 0;
    const isInline = e => { const d = getComputedStyle(e).display; return d === 'inline' || d === 'contents'; };
    const leaves = [...node.querySelectorAll('*')].filter(e => {
      if (e.closest('svg') || e.closest('.datatable') || e.closest('.tip')) return false;
      if (e.closest('.katex') && !e.matches('.katex')) return false;
      if (e.matches('.katex')) return true;
      if (isInline(e) || !hasText(e)) return false;
      return ![...e.querySelectorAll('*')].some(c => !c.closest('.katex') && !isInline(c) && hasText(c) && c !== e);
    }).filter(e => visible(e) && !hiddenFace(e));
    const svgTexts = [...node.querySelectorAll('svg text')].filter(t => visible(t) && !t.closest('.off'));
    const name = e => `"${(e.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 34)}"`;
    const [W, H] = [L.W, L.H], top = 104, bot = H - parseFloat(getComputedStyle(node).paddingBottom) + 12;
    const items = [...leaves, ...svgTexts].map(e => ({ e, b: toStage(e.getBoundingClientRect()) }));
    for (const { e, b } of items) {
      if (b.x0 < 20 || b.x1 > W - 20 || b.y0 < 20 || b.y1 > H - 16) out.push(`${name(e)} runs off the slide`);
      else if (b.y1 > bot + 2 && !e.closest('#chrome')) out.push(`${name(e)} runs into the navigation bar`);
      else if (b.y0 < top - 4 && !e.closest('#chrome')) out.push(`${name(e)} runs into the chapter bar`);
      const fs = parseFloat(getComputedStyle(e).fontSize) * s;
      if (fs < (orient === 'port' ? 10.5 : 12) && s > .3) out.push(`${name(e)} renders at ${fs.toFixed(1)}px on screen (too small)`);
      if (e.nodeType === 1 && !e.closest('svg')) { const cs = getComputedStyle(e);
        if (['block', 'flex', 'grid', 'list-item'].includes(cs.display) && cs.overflow === 'visible' && e.clientWidth && (e.scrollWidth > e.clientWidth + 3)) out.push(`${name(e)} is wider than its box`);
        // text must stay inside its glass card, clear of the rim
        const card = e.parentElement && e.parentElement.closest('.g');
        if (card && node.contains(card) && getComputedStyle(card).overflow === 'visible') { const c = toStage(card.getBoundingClientRect());
          if (b.y1 > c.y1 - 6 || b.x1 > c.x1 - 4 || b.y0 < c.y0 + 2 || b.x0 < c.x0 + 2) out.push(`${name(e)} spills out of its card`); } }
    }
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const a = items[i], b = items[j]; if (a.e.contains(b.e) || b.e.contains(a.e)) continue;
      const ov = Math.max(0, Math.min(a.b.x1, b.b.x1) - Math.max(a.b.x0, b.b.x0) - 2) * Math.max(0, Math.min(a.b.y1, b.b.y1) - Math.max(a.b.y0, b.b.y0) - 2);
      if (ov > 40) out.push(`text overlaps: ${name(a.e)} × ${name(b.e)}`);
    }
    if (node.scrollHeight > node.clientHeight + 4) out.push(`content is taller than the slide by ${node.scrollHeight - node.clientHeight}px`);
    if (sl.zoom && sl.zoom < .8) out.push(`content was shrunk to ${Math.round(sl.zoom * 100)}% to fit: cut words or split the slide`);
    node.querySelectorAll('.katex-error').forEach(e => out.push(`formula error: ${e.title || e.textContent.slice(0, 40)}`));
    node.querySelectorAll('.iv.bad').forEach(e => out.push(`could not compute {{${e.dataset.x}}}`));
    node.querySelectorAll('.vis .chart').forEach(c => { if (!c.querySelector('svg')) out.push('a chart did not draw (no room, or bad data)'); });
    node.querySelectorAll('.codebox').forEach(c => { if (c.scrollWidth > c.clientWidth + 2) out.push(`code runs off its box: "${c.textContent.split('\n').sort((a, b) => b.length - a.length)[0].slice(0, 40)}"`); });
    if (sl.r.audit) try { out.push(...sl.r.audit()); } catch (e) { out.push('audit failed: ' + e.message); }
    return [...new Set(out)];
  };
  // the hidden side of a flip card is not on screen
  const hiddenFace = e => { const f = e.closest('.face'); if (!f) return false; const on = f.closest('.flip').classList.contains('on'); return on ? f.classList.contains('front') : f.classList.contains('back'); };
  // text boxes and colours, for the contrast check in check.py (viewport px)
  L.textBoxes = function () {
    const node = L.slides[L.i].r.node, out = [];
    const ownText = e => [...e.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    node.querySelectorAll('*').forEach(e => { if (!ownText(e) || e.closest('svg') || e.closest('.katex') || e.closest('.datatable') || hiddenFace(e)) return;
      const rg = document.createRange(), rs = []; [...e.childNodes].filter(n => n.nodeType === 3 && n.textContent.trim()).forEach(n => { rg.selectNodeContents(n); rs.push(...rg.getClientRects()); });
      if (!rs.length) return; const r = { left: Math.min(...rs.map(x => x.left)), top: Math.min(...rs.map(x => x.top)), width: Math.max(...rs.map(x => x.right)) - Math.min(...rs.map(x => x.left)), height: Math.max(...rs.map(x => x.bottom)) - Math.min(...rs.map(x => x.top)) };
      if (!r.width || !r.height) return;
      const cs = getComputedStyle(e); if (+cs.opacity < .5 || cs.visibility === 'hidden') return; let n = e, hidden = false; while (n && n !== node) { if (getComputedStyle(n).opacity < .5) { hidden = true; break; } n = n.parentElement; } if (hidden) return;
      out.push({ text: e.textContent.trim().slice(0, 40), x: r.left, y: r.top, w: r.width, h: r.height, rects: rs.filter(q => q.width > 2 && q.height > 2).map(q => [q.left, q.top, q.width, q.height]),
        color: cs.color, size: parseFloat(cs.fontSize) * L.scale, weight: +cs.fontWeight }); });
    return out;
  };
  L.info = () => ({ n: L.slides.length, slides: L.slides.map((sl, i) => ({ i, type: sl.s.type || 'idea', title: L.plain(sl.s.title || sl.s.q || sl.s.text || '', sl.ctx.scope).slice(0, 60), steps: sl.steps,
    controls: (sl.s.controls || (sl.s.visual && sl.s.visual.chart && sl.s.visual.chart.controls) || []).map(c => ({ name: c.name, min: c.min, max: c.max, value: c.value ?? c.min })), predict: sl.s.type === 'predict' })), errors: L.errors });
  L.setControl = (name, v) => { const sl = L.slides[L.i]; if (sl.ctx.ctl[name]) sl.ctx.ctl[name](v); };
  L.reveal = () => { const sl = L.slides[L.i]; sl.ctx.reveal && sl.ctx.reveal(); };

  // ---------- boot ----------
  function boot() {
    const src = document.getElementById('lucid-deck');
    const deck = JSON.parse(src.textContent);
    if (CHECK) document.body.classList.add('no-anim');
    readColors(); wallpaper();
    const vp = h('div'); vp.id = 'viewport'; stage = h('div'); stage.id = 'stage'; vp.appendChild(stage); document.body.appendChild(vp);
    document.title = deck.title || 'Lucid deck';
    fit();
    build(deck); chromeBuild(); bindInput();
    L.ready = true;
    const m = /^#(\d+)(?:\.(\d+))?/.exec(location.hash);
    L.go(m ? +m[1] - 1 : 0, m && m[2] ? +m[2] : null);
  }
  const start = () => (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]) : Promise.resolve()).then(boot).catch(e => { L.err('boot', e.message); console.error(e); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  addEventListener('error', e => L.err('page', e.message));
})();
</script></body></html>
