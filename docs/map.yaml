# which writes out/map/index.html, and republish that page to `artifact` below
# (Artifact tool, publish with `url`; read it first in a new chat).
# `col` and `edges: false` place a proposed block without drawing its arrows.
# Keep `line` to one short sentence. Put the rest in `more`; reports stay in out/.
